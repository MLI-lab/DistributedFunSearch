# Note: Data directories (mnesia, logs) are set via environment variables
# RABBITMQ_MNESIA_DIR and RABBITMQ_LOG_DIR in exp1_zih.sh

# Set TCP listener port
listeners.tcp.default = 5673

# Set management plugin listener port (if you're using RabbitMQ's web management interface)
management.tcp.port = 15673

# Disable guest user loopback restriction
loopback_users.guest = false

# ===== Performance tuning =====
# Increase memory high watermark (default 0.4 = 40% of RAM)
vm_memory_high_watermark.relative = 0.6

# Increase frame_max for larger messages (default 131072)
frame_max = 524288

# CRITICAL: Disable heartbeats to prevent false disconnects under high CPU load
# RabbitMQ Erlang VM was getting starved and couldn't send heartbeats
# Setting to 0 disables heartbeats entirely (connections won't auto-close)
heartbeat = 0

# Increase channel_max (default 2047)
channel_max = 4096

# Increase TCP buffer sizes for better throughput
tcp_listen_options.backlog = 4096
tcp_listen_options.sndbuf = 196608
tcp_listen_options.recbuf = 196608

# Management stats collection interval (less frequent to reduce load)
collect_statistics_interval = 60000
