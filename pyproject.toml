[build-system]
requires = ["setuptools>=61.0", "pybind11>=2.6"]
build-backend = "setuptools.build_meta"

[project]
name = "disfun"
version = "0.1.0"
description = "DistributedFunSearch - Multi-node distributed implementation of FunSearch with cluster support via RabbitMQ"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "transformers",
  "openai",
  "aio-pika",
  "yarl",
  "psutil",
  "GPUtil",
  "memory-profiler",
  "cloudpickle",
  "nvidia-ml-py",
  "accelerate",
  "lmdb",
  "python-Levenshtein",
  "tqdm",
  "wandb",
  "matplotlib",
  "wordcloud",
  "pandas",
  "seaborn",
  "tabulate",
  "networkx",
  "aiohttp",
  "litellm",
  "vllm>=0.9.0",  # Requires 0.9.0+ for chat_template_kwargs (enable_thinking support)
  "python-dotenv",
  "requests",
  "ujson",
  "pybind11>=2.6"
]

# Additional conda dependencies:
# - graph-tool: conda install -c conda-forge graph-tool

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
disfun = "disfun.__main__:main"
