[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "disfun"
version = "0.1.0"
description = "DistributedFunSearch - Multi-node distributed implementation of FunSearch with cluster support via RabbitMQ"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "transformers",
  "openai",
  "aio-pika",
  "yarl",
  "psutil",
  "GPUtil",
  "memory-profiler",
  "cloudpickle",
  "nvidia-ml-py",
  "accelerate",
  "lmdb",
  "python-Levenshtein",
  "tqdm",
  "wandb",
  "matplotlib",
  "pandas",
  "seaborn",
  "tabulate",
  "networkx",
  "aiohttp",
  "litellm",
  "vllm>=0.7.0,<0.8.0",  # Pin to 0.7.x - stable V0 engine, 0.8+ uses V1 which has multiprocess issues
  "python-dotenv",
  "requests",
  "ujson"
]

# Additional conda dependencies:
# - graph-tool: conda install -c conda-forge graph-tool

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
disfun = "disfun.__main__:main"

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = [
    "E501",  # line too long (handled by formatter with some flexibility)
    "E741",  # ambiguous variable name (we use n, s, G intentionally)
    "F821",  # undefined name - priority/start_n are injected at runtime in spec files
    "B006",  # mutable default argument - we use these intentionally, not causing bugs
]

[tool.ruff.format]
quote-style = "double"
